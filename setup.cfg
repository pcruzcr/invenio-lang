# setup.cfg — Configuración de calidad de código (PEP 8 / PEP 20 / PEP 257)
# flake8 (PEP 8 + pyflakes + mccabe), coverage y pytest en un solo lugar.
# mypy se configura en mypy.ini (excluye módulos GUI sin stubs de Qt).

[flake8]
# PEP 8 con línea a 120 (decisión documentada); black es el formateador autoritativo.
max-line-length = 120
extend-exclude = .venv,venv,build,dist,__pycache__,gui_qt.py,gui_tk.py,parsetab.py,parser.py,parser.out
# Ignorados documentados:
#   E203/E226/E228 — en conflicto con black (PEP 8 moderno los permite)
#   E12x (E121-E133, salvo E129 ya cubierto) — indentación visual/continuación:
#     black/ruff-format mandan (formateador autoritativo); flake8 E12x choca
#     con ellos (misma familia que E203/W503 ya ignorados)
#   E401/E402      — imports condicionales defensivos (fallbacks Qt/Tk/PLY)
#   E501           — cubierto por max-line-length
#   W503/W504      — en conflicto entre sí y con black
#   E741           — nombres 'l' en código generado por PLY
#   F403/F405      — star-import de ast_nodes: patrón intencional del paquete
ignore = E203,E226,E228,E121,E122,E123,E124,E125,E126,E127,E128,E129,E131,E133,E401,E402,E501,W503,W504,E741,F403,F405
select = E,W,F
max-complexity = 25
statistics = True
count = True
# Los __init__.py re-exportan API pública (F401 intencional)
per-file-ignores =
    */__init__.py:F401

[coverage:run]
branch = True
source = inveniolang
omit =
    inveniolang/gui_qt.py
    inveniolang/gui_tk.py
    inveniolang/parsetab.py
    inveniolang/parser.out
    */__pycache__/*

[coverage:report]
# Umbral exigido también en CI (--cov-fail-under); aquí solo formato
precision = 1
show_missing = False
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    if __name__ == .__main__.:

[tool:pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning