# mypy.ini — Chequeo estático progresivo (auditoría v10.2)
# Estrategia: estricto en los módulos nuevos/núcleo, permisivo en el legado
# (gui_qt/gui_tk/semantic) para no bloquear la adopción. Los módulos
# excluidos se van "graduando" a la lista estricta con el tiempo.

[mypy]
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True
exclude = (?x)(
    ^inveniolang[\\/]gui_qt\.py$
  | ^inveniolang[\\/]gui_tk\.py$
  | ^inveniolang[\\/]parsetab\.py$
  | ^inveniolang[\\/]parser\.py$
  | ^inveniolang[\\/]semantic\.py$
  | ^inveniolang[\\/]interpreter\.py$
  | ^inveniolang[\\/]ir\.py$
  | ^inveniolang[\\/]type_checker\.py$
  | ^inveniolang[\\/]ast_nodes\.py$
  | ^inveniolang[\\/]gui[\\/]
  | ^inveniolang[\\/]builtins\.py$
  )

# Núcleo: los módulos de la auditoría deben pasar limpios
[mypy-inveniolang.observability]
disallow_untyped_defs = True

# sandbox.py: API específica de plataforma (resource/Unix, ctypes/Windows)
[mypy-inveniolang.sandbox]
disable_error_code = attr-defined, assignment, call-overload, arg-type

# ——— Módulos legado (v1.x): ignore_errors con graduación progresiva ———
# INV-1031: se graduaron (pasan sin ignorar) grammar_validator, complexity,
# docstrings, evaluation, accessibility, lsp, lms, cli, ll1, viewer, plagiarism,
# effects, core, errors y error_explainer; se retiraron
# las secciones de módulos eliminados (certification, tutor_llm, visual,
# transpiler, studio, toolchain, types, ds_visualizer, analytics, backend).
[mypy-inveniolang.ir]
ignore_errors = True

# Módulos de la fase de lenguaje (otro responsable) y GUI: siguen ignorados.
[mypy-inveniolang.symbol_table]
ignore_errors = True

[mypy-inveniolang.lexer]
ignore_errors = True

[mypy-inveniolang.parsetab]
ignore_errors = True

[mypy-inveniolang.gui.*]
ignore_errors = True

[mypy-inveniolang.semantic]
ignore_errors = True

[mypy-inveniolang.interpreter]
ignore_errors = True

[mypy-inveniolang.parser]
ignore_errors = True

[mypy-inveniolang.type_checker]
ignore_errors = True

[mypy-inveniolang.ast_nodes]
ignore_errors = True

[mypy-inveniolang.builtins]
ignore_errors = True
